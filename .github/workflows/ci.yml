name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q
      # The demos must stay runnable offline (no API key, no network).
      - run: python -m windmill.delta_reliability
      - run: python -m windmill.judge_calibration
      # The standalone files must run with no repo on the path.
      - run: cd windmill/standalone && python delta_reliability_standalone.py
      - run: cd windmill/standalone && python judge_calibration_standalone.py
